<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>T-PageCode起始页</title>
    <style>
        body{
            margin: 0;
            height: 100vh;
            position: fixed;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -o-user-select: none;
            -moz-user-select: none;
        }
        body::before{
            content: "";
            inset: 0;
            background-image: url(./bg.jpg);
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -1;
            position: fixed;
            filter: blur(5px);
            transform: scale(1.1);
        }
        #text1{
            position: fixed;
            top: 480px;
            left: 50%;
            transform: translate(-50%,-50%);
            font-size: 40px;
            font-weight: 200;
            color: white;
        }
        #text2{
            font-weight: 200;
            font-size: 15px;
        }
        #input1{
            position: fixed;
            top: 35px;
            left: 50%;
            transform: translate(-50%,-50%);
            background-color: rgb(255,255,255);
            width: 400px;
            height: 50px;
            border-radius: 800px;
            border: 5px solid transparent;
            font-size: 20px;
            transition: border-color 0.3s ease;
            text-align: center;
            font-family: Consolas,sans-serif;
        }
        #input1:focus{
            outline: none;
            border-color: rgb(255,208,0);
        }
        #searchedgine{
            position: fixed;
            top: 35px;
            left: 30%;
            transform: translate(-50%,-50%);
            background-color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
        #search{
            position: fixed;
            top: 35px;
            left: 70%;
            transform: translate(-50%,-50%);
            background-color: rgb(255, 255, 255);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease;
        }
        #search:hover{
            background-color: rgb(220,220,220)
        }
        #image1{
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            height: 70%;
        }
        #div1{
            position: fixed;
            top: 600px;
            left: 50%;
            transform: translate(-50%,-50%);
            width: 800px;
            height: 70px;
        }
    </style>
</head>
<body>
    <h1 id="text1">T-PageCode起始页</h1>
    <div id="div1">
        <input placeholder="在这里搜索" id="input1">
        <div id="searchedgine">
            <img src="./BingIcon.webp" id="image1">
        </div>
        <div id="search">
            <p id="text2">搜索</p>
        </div>
    </div>
    <script>
        let search = document.getElementById("search");
        let input1 = document.getElementById("input1");
        let inputValue = "";
        input1.addEventListener("input",() => {
            inputValue = input1.value;
        })
        search.onclick = () => {
            if (inputValue.trim() == "") {
                return;
            }
            else{
                location.href=`https://cn.bing.com/search?q=${encodeURIComponent(inputValue)}`
            }
        }
        input1.addEventListener("keydown",(e) => {
            if (e.key == "Enter") {
                if (inputValue.trim() == "") {
                    return;
                }
                else{
                    location.href=`https://cn.bing.com/search?q=${encodeURIComponent(inputValue)}`
                }
            }
        })
    </script>
</body>
</html>
